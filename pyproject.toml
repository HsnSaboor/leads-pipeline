[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leads-pipeline"
version = "0.1.0"
description = "CLI tool for automated lead generation from Google Maps with WhatsApp verification"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Botomation", email = "contact@botomation.tech" }
]
keywords = ["leads", "google-maps", "scraper", "whatsapp", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
leads = "leads_pipeline.cli:app"

[project.urls]
Homepage = "https://github.com/HsnSaboor/leads-pipeline"
Repository = "https://github.com/HsnSaboor/leads-pipeline"
Issues = "https://github.com/HsnSaboor/leads-pipeline/issues"

[tool.hatch.build.targets.wheel]
packages = ["leads_pipeline"]

[tool.hatch.build.targets.sdist]
include = [
    "/leads_pipeline",
    "/README.md",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
